{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Vendedor - Logaritmo Ferragens</title><link rel="stylesheet" href="{% static 'style.css' %}"></head>
<body>
    <nav class="sidebar">
        <h2>Logaritmo</h2>
        <ul><li><a href="#" class="active">Nova Venda</a></li></ul>
        <div style="margin-top: auto;"><a href="index.html" class="btn btn-warning btn-block" style="text-align: center;">Sair do Sistema</a></div>
    </nav>
    <main class="main-content">
        <header class="header">
            <div>
                <h1>Atendimento ao Cliente</h1>
                <p style="color: var(--text-light); margin-top: 5px;">Olá, <strong>{{ nome_usuario }}</strong></p>
            </div>
        </header>
        <div class="grid-2">
            <section class="card">
                <h2>Consultar Produto</h2>
                <div class="form-group">
                    <label>Código de Barras ou Nome:</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" placeholder="Ex: 789123456001" autofocus>
                        <button class="btn btn-primary">Buscar</button>
                    </div>
                </div>
                <div class="grid-2" style="margin-top: 20px;">
                    <div class="photo-box sm"><span>Foto</span></div>
                    <div style="background: var(--bg-color); border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; text-align: center; color: var(--text-light); display: flex; align-items: center; justify-content: center;"><p>Nenhum produto buscado ainda.</p></div>
                </div>
            </section>
            <section class="card">
                <h2>Carrinho da Venda</h2>
                <table><thead><tr><th>Produto</th><th>Qtd</th><th>Subtotal</th><th></th></tr></thead><tbody id="carrinho-corpo"></tbody></table>
                <div class="empty-table-msg">Carrinho vazio.</div>
                <div style="margin-top: 30px; border-top: 2px dashed var(--border-color); padding-top: 20px; text-align: right;"><p style="color: var(--text-light); margin-bottom: 5px;">Total a Pagar</p><h3 style="font-size: 2.5rem; color: var(--primary-blue);">R$ 0,00</h3><button class="btn btn-primary" style="margin-top: 20px; display: inline-block;" disabled>Finalizar e Enviar ao Caixa</button></div>
            </section>
        </div>
    </main>
</body>
</html>
