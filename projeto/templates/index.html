{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Logaritmo Ferragens</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="login-body">
    <div class="login-container">
        <h1>Acessar Sistema</h1>
        <p>Logaritmo Ferragens - Gestão Integrada</p>

        {% if messages %}
            <div class="messages" style="margin-bottom: 15px;">
                {% for message in messages %}
                    <p style="color: {% if message.tags == 'error' %}red{% else %}green{% endif %}; font-weight: bold;">
                        {{ message }}
                    </p>
                {% endfor %}
            </div>
        {% endif %}

        <form action="{% url 'app:login' %}" method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" name="email" required placeholder="seu.email@logaritmo.com">
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="senha" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 15px;">Entrar</button>
        </form>

        <div style="margin-top: 20px; text-align: center;">
            <a href="{% url 'app:cadastro' %}" style="color: var(--secondary-blue); text-decoration: none;">Cadastrar novo funcionário</a>
        </div>
    </div>
</body>
</html>
